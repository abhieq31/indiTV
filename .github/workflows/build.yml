# Builds indiTV and publishes it as a GitHub release whenever the app changes (for example after
# you edit src/tv/inditv/home/Family.java on github.com). TVs running indiTV offer the update by
# themselves. Needs two repository secrets: KEYSTORE_B64 (the signing key, base64) and KS_PASS.
name: Build indiTV

on:
  push:
    branches: [main]
    paths: ["src/**", "res/**", "assets/**", "aidl/**", "AndroidManifest.xml", "build.sh", ".github/workflows/build.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK pieces
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" >/dev/null

      - name: Version number
        run: |
          N=${{ github.run_number }}
          V="1.$N"
          sed -i -E "s/android:versionCode=\"[0-9]+\"/android:versionCode=\"$((100 + N))\"/; s/android:versionName=\"[^\"]*\"/android:versionName=\"$V\"/" AndroidManifest.xml
          echo "V=$V" >> "$GITHUB_ENV"

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          [ -n "$KEYSTORE_B64" ] || { echo "Add the KEYSTORE_B64 secret (see README > Build)."; exit 1; }
          printf '%s' "$KEYSTORE_B64" | base64 -d > inditv.keystore

      - name: Build
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
          BUILD_TOOLS: "34.0.0"
        run: sh build.sh

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$V" build/inditv.apk \
            --title "indiTV $V" \
            --notes "Install on the TV with the Downloader app: https://github.com/${{ github.repository }}/releases/latest/download/inditv.apk — or update from indiTV Settings > About > Check for updates."
